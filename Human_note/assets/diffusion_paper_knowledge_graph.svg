<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge graph of four foundational diffusion papers</title>
  <desc id="desc">DPM 2015 provides the probabilistic reverse-chain and variational framework to DDPM 2020. NCSN 2019 connects through multiscale score matching. DDPM provides a noise-prediction prior which LDM 2021/2022 applies in latent space. Solid lines represent direct model inheritance. The dashed line denotes the score-matching connection.</desc>
  <rect width="1600" height="760" fill="#f8fafc" />
  <text x="55" y="55" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif" fill="#1e293b">Four papers, two branches, one meeting point</text>
  <text x="55" y="89" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">A focused graph of method inheritance and conceptual connections</text>
  <rect x="55" y="135" width="390" height="190" rx="15" fill="#eaf2fb" stroke="#8bb1da" stroke-width="2" />
  <text x="80" y="170" fill="#315d8a" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">DPM · 2015</text>
  <text x="80" y="210" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="27" font-weight="700">Sohl-Dickstein et al.</text>
  <text x="80" y="247" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="21">Learn probabilistic reversal</text>
  <text x="80" y="278" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Reverse mean and covariance</text>
  <text x="80" y="305" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Variational learning framework</text>
  <rect x="55" y="440" width="390" height="190" rx="15" fill="#f2edf8" stroke="#b69dcd" stroke-width="2" />
  <text x="80" y="475" fill="#704a91" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">NCSN · 2019</text>
  <text x="80" y="515" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="27" font-weight="700">Song &amp; Ermon</text>
  <text x="80" y="552" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="21">Learn scores at many scales</text>
  <text x="80" y="583" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Noise-conditional score matching</text>
  <text x="80" y="610" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Annealed Langevin sampling</text>
  <rect x="675" y="285" width="370" height="210" rx="15" fill="#e8f5f1" stroke="#7bb5a3" stroke-width="2" />
  <text x="700" y="323" fill="#2f6d59" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">DDPM · 2020</text>
  <text x="700" y="366" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="27" font-weight="700">Ho, Jain &amp; Abbeel</text>
  <text x="700" y="405" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="21">Predict noise to denoise</text>
  <text x="700" y="439" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Noise-based reverse mean</text>
  <text x="700" y="468" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Simplified training objective</text>
  <rect x="1195" y="285" width="350" height="210" rx="15" fill="#fff3df" stroke="#d7b37b" stroke-width="2" />
  <text x="1220" y="323" fill="#8b632b" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">LDM · 2021 / 2022</text>
  <text x="1220" y="366" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="27" font-weight="700">Rombach et al.</text>
  <text x="1220" y="405" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="21">Denoise in latent space</text>
  <text x="1220" y="439" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Perceptual autoencoder</text>
  <text x="1220" y="468" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Flexible conditioning</text>
  <path d="M 445 230 C 555 230 555 340 670 340" fill="none" stroke="#34495e" stroke-width="3" />
  <text x="483" y="185" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="19" font-weight="600">Reverse chain</text>
  <text x="483" y="212" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Variational framework</text>
  <text x="483" y="586" fill="#704a91" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="600">Multiscale DSM</text>
  <text x="483" y="613" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Score connection</text>
  <path d="M 1045 390 L 1189 390" fill="none" stroke="#34495e" stroke-width="3" />
  <text x="1067" y="335" font-family="Arial, Helvetica, sans-serif" fill="#1e293b" font-size="19" font-weight="600">Noise prior</text>
  <text x="1067" y="362" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Latent transfer</text>
  <line x1="55" y1="690" x2="115" y2="690" stroke="#34495e" stroke-width="3" />
  <text x="130" y="697" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Direct model inheritance</text>
  <text x="555" y="697" font-family="Arial, Helvetica, sans-serif" fill="#475569" font-size="19">Score-matching connection, not identical samplers</text>
  <text x="55" y="735" font-size="17" fill="#64748b" font-family="Arial, Helvetica, sans-serif">Four paper nodes only. Additional foundations and later developments are discussed in the accompanying Markdown note.</text>
